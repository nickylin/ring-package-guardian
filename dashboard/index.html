<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ring Package Guardian</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" id="statusDot"></span>
      <h1>Ring Package Guardian</h1>
    </div>
    <div class="topbar-right">
      <span class="status" id="statusText">连接中…</span>
      <div class="filter" role="group" aria-label="AI 标签筛选">
        <button data-filter="all" class="active">全部</button>
        <button data-filter="package">📦 包裹</button>
        <button data-filter="person">🧍 有人</button>
        <button data-filter="none">无目标</button>
      </div>
    </div>
  </header>

  <div id="alertBanner" class="alert-banner hidden" role="alert"></div>

  <main>
    <section class="panel">
      <h2>最新告警</h2>
      <div id="alertList" class="alert-list">
        <p class="empty">暂无告警</p>
      </div>
    </section>

    <section class="panel">
      <h2>事件时间线</h2>
      <div id="timeline" class="timeline">
        <p class="empty">暂无事件</p>
      </div>
    </section>
  </main>

  <script>
    // 部署时替换为真实值；本地调试也可用 ?supabase_url=...&anon_key=... 覆盖
    const CONFIG = {
      SUPABASE_URL: "__SUPABASE_URL__",
      SUPABASE_ANON_KEY: "__SUPABASE_ANON_KEY__",
    };
  </script>
  <script src="app.js"></script>
</body>
</html>
